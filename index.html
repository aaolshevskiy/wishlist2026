<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>Розкладка плитки</title>
<style>
:root{
  --bg:#1c1c1e;--glass:rgba(36,36,38,.62);--fill:rgba(118,118,128,.2);--fill2:rgba(118,118,128,.34);
  --text:#f5f5f7;--muted:#8e8e93;--acc:#0a84ff;--ok:#30d158;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --cx:50vw;--fw:100vw;--ro:12px;--bo:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;pointer-events:none}
svg{display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.34)}
.fl{position:fixed;z-index:5}
.ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.ic svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.on{background:var(--acc)}
.ic:active{background:var(--fill)}
.btn{background:var(--fill);border-radius:11px;padding:8px 14px;min-height:34px;font-size:14px}
.btn:active{background:var(--fill2)}
.btn.acc{background:var(--acc);color:#fff}
.btn.sm{padding:5px 11px;min-height:30px;font-size:13px}
.wide{width:100%}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;border-radius:9px;padding:6px 10px;min-height:30px;font-size:13.5px;white-space:nowrap;color:#d1d1d6}
.seg button.on{background:#636366;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.glass.seg{padding:4px;border-radius:16px}
.glass.seg button{min-height:34px}

#btnPanel{left:calc(12px + var(--sl));top:calc(10px + var(--st))}
#modeSeg{left:var(--cx);transform:translateX(-50%);top:calc(10px + var(--st))}
#topR{right:calc(var(--ro) + var(--sr));top:calc(10px + var(--st));display:flex;padding:4px;gap:2px;border-radius:16px}
#tools{left:calc(12px + var(--sl));top:calc(62px + var(--st));padding:4px;display:flex;flex-direction:column;gap:2px;border-radius:16px}
#wprev,#wnext{top:50%;transform:translateY(-50%);width:38px;height:56px;border-radius:14px;font-size:26px;display:none;align-items:center;justify-content:center}
#wprev{left:calc(64px + var(--sl))}
#wnext{right:calc(var(--ro) + var(--sr))}
#note{left:var(--cx);transform:translateX(-50%);top:calc(62px + var(--st));padding:7px 14px;font-size:12.5px;color:#d1d1d6;display:none;border-radius:14px;pointer-events:none}
#drawbar{left:var(--cx);transform:translateX(-50%);bottom:calc(var(--bo) + var(--sb));padding:8px;display:none;gap:6px;align-items:center;max-width:calc(var(--fw) - 16px)}
#drawbar input{width:76px}
#drawbar .btn{padding:8px 11px;min-width:0}
@media (max-width:699px){#drawbar{gap:4px;padding:6px}#drawbar .btn{padding:8px 9px}#drawbar input{width:62px}}

#panel{right:calc(10px + var(--sr));top:calc(10px + var(--st));bottom:calc(10px + var(--sb));width:330px;padding:12px;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:24px}
#panel::-webkit-scrollbar{display:none}
#panel.hidden{display:none}
#panel section{display:none;margin-top:14px}
#panel section.on{display:block}
.title{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:2px 0 12px}
.lbl{font-size:11.5px;color:var(--muted);margin:16px 0 7px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field span{font-size:11px;color:var(--muted)}
input[type=text]{background:var(--fill);border:0;border-radius:11px;padding:9px 10px;width:100%;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
input[type=text]:focus{box-shadow:0 0 0 2px var(--acc)}
input[type=number]{background:var(--fill);border:0;border-radius:11px;padding:9px 10px;width:100%;font-size:15px;outline:none;-moz-appearance:textfield;-webkit-user-select:text;user-select:text}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]:focus{box-shadow:0 0 0 2px var(--acc)}
input::placeholder{color:#58585d}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:34px;padding:0 11px;background:var(--fill);border-radius:11px;font-size:13.5px}
.chip.on{background:rgba(10,132,255,.26);box-shadow:inset 0 0 0 1.5px var(--acc)}
.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.dot.empty{background:transparent!important;box-shadow:inset 0 0 0 1.5px #8e8e93}
.pats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pat{aspect-ratio:1;background:var(--fill);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#a1a1a6}
.pat svg{width:76%;height:76%;fill:currentColor}
.pat.on{background:rgba(10,132,255,.24);box-shadow:inset 0 0 0 1.5px var(--acc);color:#fff}
.stat{margin-top:16px}
.stat div{display:flex;justify-content:space-between;padding:4px 0;border-top:.5px solid rgba(255,255,255,.08)}
.stat span{color:var(--muted)}
.card{padding:12px 0;border-top:.5px solid rgba(255,255,255,.1)}
.card:first-child{border-top:0;padding-top:0}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:600;font-size:15px}
.card .x{color:#ff453a;font-size:20px;line-height:1;padding:0 6px}
.tsum{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.tsum b{color:var(--text);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.swatches button.on{box-shadow:0 0 0 2px #2a2a2c,0 0 0 4px var(--acc)}
table{width:100%;border-collapse:collapse}
td{padding:3px 2px;vertical-align:middle}
.badge{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#48484a;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer}
tr.sel .badge{background:var(--acc)}
tr.lnk .badge{box-shadow:0 0 0 2px var(--ok)}
.st{color:var(--muted);font-size:11.5px;white-space:nowrap;text-align:right;padding-left:6px}
.proj{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:.5px solid rgba(255,255,255,.08)}
.proj .nm{flex:1;text-align:left;min-width:0}
.proj .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .nm i{font-style:normal;font-size:11.5px;color:var(--muted)}
.proj.cur .nm b{color:var(--acc)}
.proj button.mi{width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:15px}
.proj button.mi:active{background:var(--fill)}

@media (max-width:699px){
  #panel{left:calc(8px + var(--sl));right:calc(8px + var(--sr));top:auto;bottom:calc(8px + var(--sb));width:auto;max-height:46vh;max-height:46dvh}
  #modeSeg{top:calc(58px + var(--st))}
  #tools{top:calc(108px + var(--st))}
  #note{top:calc(108px + var(--st))}
  #wprev{left:calc(64px + var(--sl))}
}
@media (pointer:coarse){input[type=number]{font-size:16px}.btn{min-height:40px}.btn.sm{min-height:34px}}
#addMenu{display:none;left:calc(72px + var(--sl));top:calc(62px + var(--st));flex-direction:column;padding:6px;gap:2px;border-radius:16px}
#addMenu.show{display:flex}
#ctx{display:none;flex-direction:column;padding:6px;gap:2px;border-radius:16px;min-width:150px;z-index:9}
#ctx button{padding:10px 18px;border-radius:12px;text-align:left;font-size:15px}
#ctx button:active{background:var(--fill)}
#editBar{left:var(--cx);transform:translateX(-50%);bottom:calc(var(--bo) + var(--sb));padding:8px 8px 8px 18px;display:none;gap:14px;align-items:center;font-size:14px;color:#d1d1d6}
#addMenu button{padding:10px 18px;border-radius:12px;text-align:left;font-size:15px}
#addMenu button:active{background:var(--fill)}
@media (max-width:699px){#addMenu{top:calc(108px + var(--st))}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<button class="fl glass ic" id="btnPanel" aria-label="Панель"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
<div class="fl glass seg" id="modeSeg"><button data-mode="plan" class="on">План</button><button data-mode="wall">Стіна</button><button data-mode="unfold">Розгортка</button><button data-mode="3d">3D</button></div>
<div class="fl glass" id="topR">
  <button class="ic" id="bUndo" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
  <button class="ic" id="bRedo" aria-label="Вперед"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
</div>
<div class="fl glass" id="tools">
  <button class="ic" id="tCursor" aria-label="Курсор"><svg viewBox="0 0 24 24"><path d="M6 3l13 8-6 2-3 7z"/></svg></button>
  <button class="ic" id="tPencil" aria-label="Олівець"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
  <button class="ic" id="tRuler" aria-label="Рулетка"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="ic" id="tAdd" aria-label="Додати"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ic" id="tMark" aria-label="Розмітка"><svg viewBox="0 0 24 24"><path d="M4 7v10M20 7v10M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/></svg></button>
  <button class="ic on" id="tMagnet" aria-label="Магніт"><svg viewBox="0 0 24 24"><path d="M5 4v7a7 7 0 0014 0V4h-4v7a3 3 0 01-6 0V4z"/><path d="M5 8h4M15 8h4"/></svg></button>
  <button class="ic" id="tLink" aria-label="Прив'язка швів"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg></button>
  <button class="ic" id="tFit" aria-label="Вмістити"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<button class="fl glass" id="wprev" aria-label="Попередня">‹</button>
<button class="fl glass" id="wnext" aria-label="Наступна">›</button>
<div class="fl glass" id="addMenu"><button data-add="door">Двері</button><button data-add="win">Вікно</button><button data-add="inst">Інсталяція</button><button data-add="box">Об'єм</button></div>
<div class="fl glass" id="note"></div>
<div class="fl glass" id="ctx"><button id="ctxEdit">Змінити</button><button id="ctxDel">Видалити</button></div>
<div class="fl glass" id="editBar"><span>Режим «Змінити»</span><button class="btn acc" id="editOk">OK</button></div>
<div class="fl glass" id="drawbar">
  <button class="btn" id="dbCancel" aria-label="Скасувати">✕</button><button class="btn" id="dbBack" aria-label="Крок назад">⌫</button>
  <input type="number" id="dbLen" placeholder="мм" inputmode="numeric">
  <button class="btn" data-dir="-1,0">←</button><button class="btn" data-dir="0,-1">↑</button><button class="btn" data-dir="0,1">↓</button><button class="btn" data-dir="1,0">→</button>
  <button class="btn acc" id="dbClose">Замкнути</button>
</div>

<div class="fl glass" id="panel">
  <div class="seg" id="tabSeg"><button data-tab="layout" class="on">Розкладка</button><button data-tab="tiles">Плитки</button><button data-tab="room">Кімната</button><button data-tab="proj">Проєкти</button></div>

  <section id="tab-layout">
    <div id="noSel" class="muted" style="padding:18px 0 6px">Оберіть стіну або підлогу</div>
    <div id="selWrap">
      <div class="title" id="selTitle"></div>
      <div id="itemWrap">
        <div class="field" style="margin-bottom:10px"><span>Назва</span><input type="text" id="itemName" placeholder="Елемент"></div>
        <div class="g2">
          <div class="field" data-fw="u"><span>Від кута</span><input type="number" data-if="u" inputmode="decimal"></div>
          <div class="field" data-fw="w"><span>Ширина</span><input type="number" data-if="w" inputmode="decimal"></div>
          <div class="field" data-fw="h"><span>Висота</span><input type="number" data-if="h" inputmode="decimal"></div>
          <div class="field" data-fw="v"><span>Від підлоги</span><input type="number" data-if="v" inputmode="decimal"></div>
          <div class="field" data-fw="d"><span>Глибина</span><input type="number" data-if="d" inputmode="decimal"></div>
        </div>
        <div id="vertList"></div>
        <div class="row" style="margin-top:12px"><button class="chip" id="revBtn">Відкоси плиткою</button><button class="btn sm" id="itemDel" style="margin-left:auto">Видалити</button></div>
      </div>
      <div class="chips" id="faceRow" style="margin-bottom:10px"></div>
      <div id="tileBlock">
        <div class="chips" id="tileSel"></div>
        <div class="lbl">Схема</div>
        <div class="pats" id="pats"></div>
        <div class="lbl">Поворот</div>
        <div class="seg" id="rotSeg"><button data-rot="0">0°</button><button data-rot="45">45°</button><button data-rot="90">90°</button></div>
        <div class="lbl">Зсув, мм</div>
        <div class="g2">
          <div class="field"><span>X</span><input type="number" id="ox" inputmode="decimal" step="1"></div>
          <div class="field"><span>Y</span><input type="number" id="oy" inputmode="decimal" step="1"></div>
        </div>
      </div>
      <div id="linkRow"><button class="btn wide" id="linkBtn" style="margin-top:14px"></button></div>
      <div id="wallOnly">
        <div class="lbl" id="itemsLbl">Об'єкти</div>
        <div class="chips" id="itemList"></div>
        <div id="syncBox">
          <div class="lbl">Поширити на</div>
          <div class="chips" id="syncList"></div>
          <div class="row" style="margin-top:8px"><button class="btn sm" id="syncAll">Усі</button><button class="btn sm" id="syncCopy">Копіювати</button></div>
        </div>
      </div>
      <div class="stat" id="stat"></div>
    </div>
  </section>

  <section id="tab-tiles">
    <div id="tileList"></div>
    <button class="btn wide" id="addTile">+ Плитка</button>
    <div class="lbl">Разом</div>
    <div class="stat" id="grand" style="margin-top:0"></div>
  </section>

  <section id="tab-room">
    <div class="field"><span>Висота, мм</span><input type="number" id="roomH" min="500" step="10" inputmode="numeric"></div>
    <button class="btn wide" id="btnDraw" style="margin-top:12px">Накреслити контур</button>
    <div class="lbl">Стіни</div>
    <table id="wallTable"></table>
  </section>

  <section id="tab-proj">
    <button class="btn wide" id="pNew">+ Новий проєкт</button>
    <div id="projList" style="margin-top:10px"></div>
    <div class="row" style="margin-top:12px"><button class="btn sm" id="btnSave">Експорт</button><button class="btn sm" id="btnLoad">Імпорт</button></div>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </section>
</div>

<script>
'use strict';
/* ================= утиліти ================= */
const $ = s => document.querySelector(s);
const mod = (a, m) => ((a % m) + m) % m;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => String(Math.round(v));
function mix(c, d, t){
  const a = parseInt(c.slice(1), 16), b = parseInt(d.slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}
const C = {bg:'#1c1c1e', grid:'#232325', gridM:'#2b2b2e', grout:'#050506', empty:'#29292c', line:'#8e8e93', acc:'#0a84ff', ok:'#30d158', warn:'#ffb340', text:'#f5f5f7', halo:'rgba(28,28,30,.92)', dim:'rgba(200,200,208,.6)'};
const PALETTE = ['#f5f5f7', '#c7c7cc', '#e3d3b8', '#8ecbf0', '#a3d9b1', '#f0a07c', '#8a8f9e'];
const PATS = [['1', 'Пряма'], ['2', 'Цегла ½'], ['3', 'Цегла ⅓'], ['4', 'Цегла ¼'], ['chess', 'Шахматка'], ['hb', 'Ялинка'], ['dhb', 'Подвійна ялинка'], ['chev', 'Шеврон'], ['bsk', 'Кошик'], ['pin', 'Вітряк'], ['hex', 'Соти']];
const GRID = ['1', '2', '3', '4', 'chess'];

/* ================= стан та проєкти ================= */
const IDX = 'tileLayout.index', PKEY = id => 'tileLayout.p.' + id;
let idx = {cur:null, list:[]}, S = null;
const wallDef = () => ({tile:0, pat:'1', rot:0, ox:0, oy:0, link:false, ops:[]});
const boxDef = () => ({kind:'box', wall:0, u:0, v:0, w:600, d:300, h:1200, tile:0, pat:'1', rot:0, ox:0, oy:0, link:false, fl:{}});
const tileDef = i => ({tw:null, th:null, j:2, color:PALETTE[i % PALETTE.length]});
function defState(){ return {H:2500, pts:[], walls:[], boxes:[], floor:{tile:1, pat:'1', rot:0, fx:0, fy:0}, tiles:[tileDef(0), tileDef(1)], sel:-1, none:false}; }
function normalize(){
  if (!S || !Array.isArray(S.pts)) S = defState();
  const d = defState();
  S.H = S.H > 0 ? S.H : d.H;
  if (!Array.isArray(S.tiles) || !S.tiles.length) S.tiles = d.tiles;
  while (S.tiles.length < 2) S.tiles.push(tileDef(S.tiles.length));
  S.tiles = S.tiles.map((t, i) => Object.assign(tileDef(i), t));
  const nt = S.tiles.length;
  const fixS = o => { if (o.pat === '45'){ o.pat = '1'; o.rot = 45; } if (!PATS.some(p => p[0] === o.pat)) o.pat = '1'; if (![0, 45, 90].includes(o.rot)) o.rot = 0; if (!(o.tile < nt)) o.tile = 0; return o; };
  S.floor = fixS(Object.assign({}, d.floor, S.floor || {}));
  S.walls = Array.isArray(S.walls) ? S.walls : [];
  while (S.walls.length < S.pts.length) S.walls.push(wallDef());
  S.walls.length = S.pts.length;
  S.walls = S.walls.map(w => { w = fixS(Object.assign(wallDef(), w)); w.ops = (Array.isArray(w.ops) ? w.ops : []).map(o => Object.assign({t:'door', u:0, v:0, w:900, h:2100, rev:false, d:100, tile:null, pat:'1', rot:0, ox:0, oy:0}, o)); return w; });
  S.boxes = (Array.isArray(S.boxes) ? S.boxes : []).filter(b => b && b.wall < S.walls.length && (b.kind !== 'prism' || Array.isArray(b.poly))).map(b => { b = fixS(Object.assign(boxDef(), b)); if (!b.fl || typeof b.fl !== 'object') b.fl = {}; for (const k of Object.keys(b.fl)) fixS(b.fl[k]); return b; });
  if (typeof S.sel !== 'number' || S.sel >= S.pts.length) S.sel = S.pts.length ? 0 : -1;
  S.none = !!S.none;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function saveIndex(){ try { localStorage.setItem(IDX, JSON.stringify(idx)); } catch (e) {} }
function readProject(id){ try { const r = localStorage.getItem(PKEY(id)); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function loadIndex(){

/* ================= рулетка ================= */
function snapPlan(p){
  let best = null, bd = 14;
  const test = (x, y) => { const q = P2S(x, y), d = Math.hypot(q[0] - p.x, q[1] - p.y); if (d < bd){ bd = d; best = {x, y}; } };
  S.pts.forEach(v => test(v.x, v.y));
  const f = cfg(S.floor);
  if (valid(f) && Math.min(f.tw, f.th) * V.plan.s > 8) for (const t of floorTiles()) for (const c of corners(t)) test(c[0], c[1]);
  if (best) return best;
  const [x, y] = S2P(p.x, p.y); return {x:Math.round(x), y:Math.round(y)};
}
function snapWall(p){
  const g = wallGeom(S.sel), s = V.wall.s; let best = null, bd = 14;
  const test = (u, v) => { const d = Math.hypot(V.wall.tx + u * s - p.x, V.wall.ty - v * s - p.y); if (d < bd){ bd = d; best = {x:u, y:v}; } };
  [[0, 0], [g.L, 0], [g.L, S.H], [0, S.H]].forEach(c => test(c[0], c[1]));
  const w = cfg(S.walls[S.sel]);
  if (valid(w) && Math.min(w.tw, w.th) * s > 8) for (const t of wallTiles(S.sel)) for (const c of corners(t)) test(c[0], c[1]);

}

  else if (V.mode === 'unfold') pt = {x:Math.round((p.x - V.unf.tx) / V.unf.s), y:Math.round((V.unf.ty - p.y) / V.unf.s)};

    const h = hit3D(p); if (!h) return null;
    const pp = planePoint(p.x, p.y, h.t === 'floor' ? -1 : h.i); if (!pp) return null;
    if (h.t === 'floor') pt = {x:pp.u, y:0, z:pp.v};

}

    : m === 'unfold' ? (q => [V.unf.tx + q.x * V.unf.s, V.unf.ty - q.y * V.unf.s])
    : (q => { const r = V.proj && V.proj([q.x, q.y, q.z]); return r ? [r[0], r[1]] : null; });
  const A = map(R.a), B = R.b ? map(R.b) : null;
  ctx.save(); ctx.lineCap = 'round';
  if (A && B){ ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffd60a'; ctx.stroke(); }
  for (const P of [A, B]) if (P){ ctx.beginPath(); ctx.arc(P[0], P[1], 5, 0, 7); ctx.fillStyle = '#ffd60a'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke(); }
  if (A && B){

function planHit(px, py, touch){

    const g = wallGeom(b.wall), pr = b.kind === 'prism', bb = pr ? polyBox(b.poly) : null, u0 = pr ? bb.x0 : b.u, u1 = pr ? bb.x1 : b.u + b.w;
    const u = (x - g.a.x) * g.d.x + (y - g.a.y) * g.d.y, dv = (x - g.a.x) * g.n.x + (y - g.a.y) * g.n.y;

/* ================= клавіатура ================= */
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' && e.target.type !== 'checkbox' || tag === 'textarea';
  if ((e.metaKey || e.ctrlKey) && !typing && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.metaKey || e.ctrlKey) && !typing && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (e.code === 'Space' && !typing){ spaceDown = true; e.preventDefault(); }
  if (typing) return;
  if (D.active){
    if (/^[0-9]$/.test(e.key) && D.pts.length){ D.buf += e.key; redraw(); e.preventDefault(); }
    else if (e.key === 'Backspace'){ if (D.buf) D.buf = D.buf.slice(0, -1); else D.pts.pop(); redraw(); e.preventDefault(); }

    return;
  }

  if ((e.key === 'Delete' || e.key === 'Backspace') && getItem()){ e.preventDefault(); deleteItem(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !S.none && S.sel >= 0 && S.pts.length){ e.preventDefault(); deleteWall(S.sel); return; }
  const step = e.shiftKey ? 10 : 1;
  const mv = (dx, dy) => { const o = getOffs(); if (!valid(o.cfg)) return; setOffs(o.x + dx * step, o.y + (S.sel < 0 ? -dy : dy) * step); changed(); e.preventDefault(); };

window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; if (e.key === 'Shift') D.free = false; });

/* ================= старт ================= */

  resize();
  if (!S.pts.length) startDraw();
}
